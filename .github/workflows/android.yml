name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.30.5"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Collision harness on aarch64 (NDK clang, static Bionic, qemu-user)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" tools/port/collision_harness/run.sh --android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperShipMobile-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unstripped native library (for symbolising crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: PaperShipMobile-debug-symbols
          path: android/app/build/intermediates/merged_native_libs/debug/**/libPaperShip.so
          if-no-files-found: warn

  selftest:
    name: Linux GLES self-test (ROM offsets + shaders)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build cmake pkg-config xvfb mesa-utils \
            libsdl2-dev libgles-dev libegl-dev libgl1-mesa-dev libgl1-mesa-dri libglew-dev libglvnd-dev \
            libspdlog-dev libfmt-dev libtinyxml2-dev libzip-dev nlohmann-json3-dev libpng-dev \
            libtcc-dev catch2 libpulse-dev libasound2-dev libdbus-1-dev libudev-dev \
            zipcmp zipmerge ziptool

      - name: Collision harness on the host
        run: CC=clang tools/port/collision_harness/run.sh --host

      - name: Configure (OpenGL ES 3 like Android)
        run: >
          cmake -S . -B build-gles -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DUSE_OPENGLES=ON

      - name: Build
        run: ninja -C build-gles PaperShip

      - name: Pack port assets
        run: |
          python3 tools/port/pack_o2r.py assets/port build-gles/papership.o2r
          curl -fsSL -o build-gles/gamecontrollerdb.txt \
            https://raw.githubusercontent.com/gabomdq/SDL_GameControllerDB/master/gamecontrollerdb.txt \
            || echo "# gamecontrollerdb.txt could not be downloaded" > build-gles/gamecontrollerdb.txt

      - name: Run self-test under Xvfb (Mesa llvmpipe)
        working-directory: build-gles
        env:
          PAPERSHIP_SELFTEST: "1"
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" ./PaperShip > selftest.log 2>&1
          status=$?
          grep -E "\[(rom_offsets|selftest)\]|GL_VERSION|FAILED|LINK FAILED" selftest.log | grep -v "new shader" || true
          echo "PaperShip exit code: $status"
          exit $status

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: build-gles/selftest.log
          if-no-files-found: warn
