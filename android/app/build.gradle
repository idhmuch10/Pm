// PaperShip Mobile application module.
//
// The native side is the repository's root CMakeLists.txt, which builds the
// Paper Mario decomp + PaperShip port layer + libultraship as libPaperShip.so
// (and SDL2 as libSDL2.so). Both are loaded by MainActivity (an SDLActivity).
plugins {
    id "com.android.application"
}

def repoRoot = rootProject.file("..")
def cmakeLists = new File(repoRoot, "CMakeLists.txt")

// Keep the archive version in sync with project(PaperShip VERSION x.y.z) in CMakeLists.txt.
def portVersion = "0.1.0"
def versionMatcher = (cmakeLists.text =~ /project\(PaperShip VERSION (\d+)\.(\d+)\.(\d+)/)
if (versionMatcher.find()) {
    portVersion = "${versionMatcher.group(1)}.${versionMatcher.group(2)}.${versionMatcher.group(3)}"
}
def portVersionParts = portVersion.tokenize(".").collect { it.toInteger() }

// Which ABIs to build. arm64-v8a covers every phone sold in the last decade;
// pass -PabiFilters=arm64-v8a,x86_64 to also build for the emulator.
def abiList = (project.findProperty("abiFilters") ?: "arm64-v8a").toString().split(",").collect { it.trim() }

// Version code derived from the port version (major.minor.patch -> MMmmpp).
def computedVersionCode = portVersionParts[0] * 10000 + portVersionParts[1] * 100 + portVersionParts[2]

android {
    namespace "com.papership.mobile"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.papership.mobile"
        minSdk 24
        targetSdk 35
        versionCode computedVersionCode == 0 ? 1 : computedVersionCode
        versionName portVersion

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_ARM_NEON=ON",
                          "-DSDL_SHARED=ON",
                          "-DSDL_STATIC=OFF",
                          "-DSDL_TEST=OFF",
                          "-DUSE_OPENGLES=ON"
                targets "PaperShip", "SDL2"
                cppFlags ""
            }
        }
        ndk {
            abiFilters(*abiList)
        }
    }

    buildTypes {
        debug {
            // A -O0 build of the whole game is unplayably slow; keep symbols but optimise.
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Unsigned release builds cannot be installed; sign with the debug key unless
            // a real signing config is provided (see docs/ANDROID.md).
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path cmakeLists
            // libultraship requires CMake >= 3.24 (the SDK's bundled 3.22.1 is too old).
            version "3.24.0+"
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir("generated/papership-assets").get().asFile
        }
    }
}

// ---------------------------------------------------------------------------
// Generated APK assets: the port archive (shaders) and SDL's controller database.
// Both are copied by MainActivity into the app's data directory on launch,
// where libultraship / the port layer look for them.
// ---------------------------------------------------------------------------
def generatedAssetsDir = layout.buildDirectory.dir("generated/papership-assets")
def portVersionFile = layout.buildDirectory.file("generated/portVersion/portVersion")

// Torch writes a 6-byte big-endian (major, minor, patch) "portVersion" entry into
// the archive; reproduce it here so libultraship can validate the archive.
tasks.register("writePortVersion") {
    def out = portVersionFile.get().asFile
    outputs.file(out)
    doLast {
        out.parentFile.mkdirs()
        def bytes = new byte[6]
        for (int i = 0; i < 3; i++) {
            bytes[i * 2] = (byte) ((portVersionParts[i] >> 8) & 0xFF)
            bytes[i * 2 + 1] = (byte) (portVersionParts[i] & 0xFF)
        }
        out.bytes = bytes
    }
}

// Equivalent of the desktop "GeneratePortO2R" target: zip assets/port into papership.o2r.
tasks.register("packPortO2R", Zip) {
    dependsOn "writePortVersion"
    from(new File(repoRoot, "assets/port"))
    from(portVersionFile)
    archiveFileName = "papership.o2r"
    destinationDirectory = generatedAssetsDir
    entryCompression = ZipEntryCompression.DEFLATED
    includeEmptyDirs = false
}

// SDL_GameControllerDB gives sensible default mappings for bluetooth/USB gamepads.
tasks.register("fetchGameControllerDb") {
    def out = generatedAssetsDir.get().file("gamecontrollerdb.txt").asFile
    outputs.file(out)
    outputs.upToDateWhen { out.exists() && out.length() > 0 }
    doLast {
        out.parentFile.mkdirs()
        if (out.exists() && out.length() > 0) {
            return
        }
        try {
            new URL("https://raw.githubusercontent.com/gabomdq/SDL_GameControllerDB/master/gamecontrollerdb.txt")
                .withInputStream { input -> out.withOutputStream { output -> output << input } }
        } catch (Exception e) {
            logger.warn("Could not download gamecontrollerdb.txt (${e.message}); using an empty file.")
            out.text = "# gamecontrollerdb.txt could not be downloaded at build time\n"
        }
    }
}

android.applicationVariants.all { variant ->
    def merge = tasks.named("merge${variant.name.capitalize()}Assets")
    merge.configure { dependsOn("packPortO2R", "fetchGameControllerDb") }
    tasks.named("generate${variant.name.capitalize()}Assets").configure { dependsOn("packPortO2R", "fetchGameControllerDb") }
}
tasks.named("preBuild").configure { dependsOn("packPortO2R", "fetchGameControllerDb") }
